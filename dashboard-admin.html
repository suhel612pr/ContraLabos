<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Dashboard — Contralabos Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="dashboard">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard-admin.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_dashboard">Dashboard</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="ttl_Platform Overview">Platform Overview</div><div class="page-sub" data-i18n="ttl_System-level status and organization health">System-level status and organization health</div></div>
</div>
<div class="stat-row">
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Total Users">Total Users</div><div class="s-value" id="totalUsers">—</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Active Projects">Active Projects</div><div class="s-value" id="totalProj">—</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Organizations">Organizations</div><div class="s-value">1</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_System Status">System Status</div><div class="s-value" style="color:var(--c-status-approved);font-size:15px;">● Operational</div></div>
</div>
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Recent Logins">Recent Logins</h3></div>
<div class="table-wrap">
<table class="data-table">
<thead><tr><th data-i18n="ttl_User">User</th><th data-i18n="ttl_Role">Role</th><th data-i18n="ttl_Time">Time</th><th data-i18n="ttl_Status">Status</th></tr></thead>
<tbody id="loginTable"></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  let _adUsers, _adProjects;
  function renderAdmin(){
    if(!_adUsers) return;
    document.getElementById("totalUsers").textContent = _adUsers.length;
    document.getElementById("totalProj").textContent = _adProjects.filter(p=>p.status==='active').length;
    document.getElementById("loginTable").innerHTML = _adUsers.map(u => `
      <tr><td>${u.name}</td><td>${tRole(u.role)}</td><td>—</td><td><span class="badge approved">${t("ttl_Active")}</span></td></tr>`).join("");
  }
  document.addEventListener("shell:ready", async () => {
    _adUsers = await Contralabos.users.list();
    _adProjects = await Contralabos.projects.list();
    renderAdmin();
  });
  document.addEventListener("languagechange:contralabos", renderAdmin);
</script>
</body>
</html>
