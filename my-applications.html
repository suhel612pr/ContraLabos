<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>My Applications — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="myapplications">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard-worker.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_myapplications">My Applications</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="title_myapplications">My Applications</div><div class="page-sub" data-i18n="sub_myapplications">Jobs you've applied to, and their status</div></div>
</div>
<div class="panel">
<table class="data-table">
<thead><tr>
<th data-i18n="ttl_Job Title*">Job</th><th>Contractor</th><th data-i18n="ttl_City*">Location</th>
<th data-i18n="ttl_Wage (₹)">Wage</th><th>Applied</th><th>Status</th><th></th>
</tr></thead>
<tbody id="appsBody"></tbody>
</table>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return n === null || n === undefined ? "—" : "₹" + Number(n).toLocaleString("en-IN"); }
  let allApps = [];

  function row(a){
    const j = a.job || {};
    return `<tr>
      <td><a href="job-detail.html?id=${a.jobId}" style="color:var(--c-gold-light);">${j.title || "—"}</a></td>
      <td>${j.contractorName || "—"}</td>
      <td>${j.city || "—"}${j.area ? ", "+j.area : ""}</td>
      <td>${j.wage ? inr(j.wage) + "/" + tBadge(j.wageType||"daily") : "—"}</td>
      <td>${new Date(a.createdAt).toLocaleDateString("en-IN")}</td>
      <td><span class="badge ${badgeClass(a.status)}">${tBadge(a.status)}</span></td>
      <td style="text-align:right;">
        ${["pending","shortlisted"].includes(a.status) ? `<button class="btn btn-sm btn-danger" data-id="${a.id}">${t("ttl_Withdraw Application")}</button>` : ""}
      </td>
    </tr>`;
  }

  function render(){
    document.getElementById("appsBody").innerHTML = allApps.length
      ? allApps.map(row).join("")
      : `<tr><td colspan="7"><div class="empty-state">${t("ttl_You haven't applied to any jobs yet.")}</div></td></tr>`;
  }

  document.getElementById("appsBody").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-id]");
    if(!btn) return;
    if(!confirm("Withdraw this application?")) return;
    btn.disabled = true;
    try{ await Contralabos.marketplace.applications.withdraw(btn.dataset.id); await load(); }
    catch(err){ alert(err.message || t("ttl_Unable to submit application.")); btn.disabled = false; }
  });

  async function load(){ allApps = await Contralabos.marketplace.applications.mine(); render(); }
  document.addEventListener("shell:ready", load);
  document.addEventListener("languagechange:contralabos", render);
</script>
</body>
</html>
