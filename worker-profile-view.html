<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Worker Profile — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="workerprofileview">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><a href="find-workers.html" data-i18n="nav_findworkers">Find Workers</a><span class="sep">/</span><span class="current" id="bcName">Worker</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="wName">—</div><div class="page-sub" id="wSub">—</div></div>
<div class="page-actions">
<button class="btn" id="callBtn" data-i18n="ttl_Call">Call</button>
<button class="btn btn-primary" id="offerBtn" data-i18n="ttl_Send Job Offer">Send Job Offer</button>
</div>
</div>
<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;">
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Job Details">Profile</h3></div>
<div class="panel-body"><table class="data-table" style="border:none;"><tbody id="detailTable"></tbody></table></div>
</div>
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Skills">Skills</h3></div>
<div class="panel-body"><div class="mc-tags" id="skillTags"></div></div>
</div>
</div>
</div>
</div>
</div>
</div>
<div class="modal-overlay" id="offerModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;align-items:center;justify-content:center;">
<div class="panel" style="width:min(480px,92vw);">
<div class="panel-head"><h3 data-i18n="ttl_Send Job Offer">Send Job Offer</h3></div>
<div class="panel-body">
<div class="field"><label data-i18n="ttl_Select a Job*">Select a Job *</label><select id="offerJob" style="width:100%;"></select></div>
<div class="field"><label data-i18n="ttl_Offered Wage (₹)">Offered Wage (₹)</label><input id="offerWage" min="0" type="number"/></div>
<div class="field"><label data-i18n="ttl_Offer Message">Offer Message</label><textarea id="offerMsg" rows="3" style="width:100%;background:var(--c-bg-inset);border:1px solid var(--c-border);color:var(--c-text);padding:10px;border-radius:var(--r-sm);"></textarea></div>
<div style="display:flex;gap:10px;justify-content:flex-end;">
<button class="btn" id="offerCancel" data-i18n="ttl_Cancel Job">Cancel</button>
<button class="btn btn-primary" id="offerSend" data-i18n="ttl_Send Offer">Send Offer</button>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return n === null || n === undefined ? "—" : "₹" + Number(n).toLocaleString("en-IN"); }
  const workerId = new URLSearchParams(window.location.search).get("id");
  let _worker;

  document.addEventListener("shell:ready", async () => {
    _worker = await Contralabos.marketplace.workerProfiles.get(workerId);
    if(!_worker){ document.querySelector(".page").innerHTML = "<p>Worker not found.</p>"; return; }
    document.getElementById("bcName").textContent = _worker.name || "Worker";
    document.getElementById("wName").textContent = _worker.name || "Worker";
    document.getElementById("wSub").textContent = `${_worker.city || ""}${_worker.area ? ", "+_worker.area : ""}`;
    document.getElementById("callBtn").onclick = () => { if(_worker.phone) window.location.href = "tel:" + _worker.phone; };
    document.getElementById("detailTable").innerHTML = `
      <tr><td style="color:var(--c-text-dim);width:160px;">${t("ttl_Worker Type")}</td><td>${_worker.workerType ? tBadge(_worker.workerType) : "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Experience")}</td><td>${_worker.experienceYears || 0} ${t("ttl_years")}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Availability")}</td><td><span class="badge ${_worker.availability==='available'?'approved':'pending'}">${tBadge(_worker.availability)}</span></td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Expected Wage")}</td><td>${_worker.expectedWage ? inr(_worker.expectedWage) + " / " + tBadge(_worker.expectedWageType||"daily") : "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Description")}</td><td>${_worker.bio || "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">Phone</td><td>${_worker.phone || "—"}</td></tr>`;
    document.getElementById("skillTags").innerHTML = (_worker.skills||[]).length
      ? _worker.skills.map(s => `<span class="mkt-tag">${s}</span>`).join("")
      : `<div class="empty-state">—</div>`;

    const myJobs = (await Contralabos.marketplace.jobs.mine()).filter(j => j.status === "published" && j.workersHired < j.workersRequired);
    document.getElementById("offerJob").innerHTML = myJobs.length
      ? myJobs.map(j => `<option value="${j.id}" data-wage="${j.wage||''}">${j.title} — ${j.city||""}</option>`).join("")
      : `<option value="">No open jobs — post one first</option>`;
  });

  document.getElementById("offerBtn").addEventListener("click", () => {
    document.getElementById("offerModal").style.display = "flex";
  });
  document.getElementById("offerCancel").addEventListener("click", () => {
    document.getElementById("offerModal").style.display = "none";
  });
  document.getElementById("offerJob").addEventListener("change", (e) => {
    const opt = e.target.selectedOptions[0];
    document.getElementById("offerWage").value = opt ? opt.dataset.wage || "" : "";
  });
  document.getElementById("offerSend").addEventListener("click", async () => {
    const jobId = document.getElementById("offerJob").value;
    if(!jobId){ alert("Please post a job first, or select one."); return; }
    try{
      await Contralabos.marketplace.offers.send({
        jobId, workerId,
        offeredWage: document.getElementById("offerWage").value ? Number(document.getElementById("offerWage").value) : undefined,
        message: document.getElementById("offerMsg").value,
      });
      document.getElementById("offerModal").style.display = "none";
      alert("Offer sent.");
    }catch(err){ alert(err.message || t("ttl_Unable to send job offer.")); }
  });
</script>
</body>
</html>
