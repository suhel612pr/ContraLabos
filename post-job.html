<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Post Job — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="postjob">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><a href="my-jobs.html" data-i18n="nav_myjobs">My Jobs</a><span class="sep">/</span><span class="current" data-i18n="nav_postjob">Post Job</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="pageTitle" data-i18n="title_postjob">Post a Labour Requirement</div><div class="page-sub" data-i18n="sub_postjob">Publish a job and start receiving applications</div></div>
</div>
<div class="panel">
<div class="panel-body">
<form id="jobForm">
<div class="form-grid">
<div class="field field-full"><label data-i18n="ttl_Job Title*">Job Title <span class="req">*</span></label><input id="jTitle" required type="text" placeholder="e.g. Mason Required"/></div>
<div class="field field-full"><label data-i18n="ttl_Description">Description</label><textarea id="jDesc" rows="3" style="width:100%;background:var(--c-bg-inset);border:1px solid var(--c-border);color:var(--c-text);padding:10px 12px;border-radius:var(--r-sm);font-size:13px;"></textarea></div>
<div class="field"><label data-i18n="ttl_Category">Category</label><input id="jCategory" type="text" placeholder="e.g. Masonry, Electrical"/></div>
<div class="field"><label data-i18n="ttl_Skill Required">Skill Required</label><input id="jSkill" type="text" placeholder="e.g. Mason"/></div>
<div class="field"><label data-i18n="ttl_Worker Type">Worker Type</label>
<select id="jWorkerType"><option value="">—</option><option data-i18n="ttl_Skilled" value="skilled">Skilled</option><option data-i18n="ttl_Unskilled" value="unskilled">Unskilled</option><option data-i18n="ttl_Semi-skilled" value="semi_skilled">Semi-skilled</option></select>
</div>
<div class="field"><label data-i18n="ttl_Workers Required*">Workers Required <span class="req">*</span></label><input id="jWorkersRequired" min="1" required type="number" value="1"/></div>
<div class="field"><label data-i18n="ttl_City*">City <span class="req">*</span></label><input id="jCity" required type="text" placeholder="e.g. Pune"/></div>
<div class="field"><label data-i18n="ttl_Area">Area</label><input id="jArea" type="text" placeholder="e.g. Kharadi"/></div>
<div class="field field-full"><label data-i18n="ttl_Address">Address</label><input id="jAddress" type="text"/></div>
<div class="field"><label data-i18n="ttl_Wage (₹)">Wage (₹)</label><input id="jWage" min="0" type="number"/></div>
<div class="field"><label data-i18n="ttl_Wage Type">Wage Type</label>
<select id="jWageType"><option data-i18n="ttl_Daily" value="daily">Daily</option><option data-i18n="ttl_Weekly" value="weekly">Weekly</option><option data-i18n="ttl_Monthly" value="monthly">Monthly</option><option data-i18n="ttl_Fixed" value="fixed">Fixed</option></select>
</div>
<div class="field"><label data-i18n="ttl_Start Date">Start Date</label><input id="jStart" type="date"/></div>
<div class="field"><label data-i18n="ttl_End Date">End Date</label><input id="jEnd" type="date"/></div>
<div class="field"><label data-i18n="ttl_Working Hours">Working Hours</label><input id="jHours" type="text" placeholder="e.g. 9am–6pm"/></div>
<div class="field"><label data-i18n="ttl_Experience Required (years)">Experience Required (years)</label><input id="jExp" min="0" step="0.5" type="number" value="0"/></div>
<div class="field"><label data-i18n="ttl_Urgency">Urgency</label><input id="jUrgency" type="text" placeholder="e.g. Immediate, Within a week"/></div>
<div class="field field-full"><label data-i18n="ttl_Additional Requirements">Additional Requirements</label><input id="jExtra" type="text"/></div>
</div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:10px;">
<button class="btn" id="draftBtn" type="button" data-i18n="ttl_Save as Draft">Save as Draft</button>
<button class="btn btn-primary" id="publishBtn" type="submit" data-i18n="ttl_Publish Job">Publish Job</button>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const editId = params.get("id");

  function collect(){
    return {
      title: document.getElementById("jTitle").value,
      description: document.getElementById("jDesc").value,
      category: document.getElementById("jCategory").value,
      skillRequired: document.getElementById("jSkill").value,
      workerType: document.getElementById("jWorkerType").value || null,
      workersRequired: Number(document.getElementById("jWorkersRequired").value) || 1,
      city: document.getElementById("jCity").value,
      area: document.getElementById("jArea").value,
      address: document.getElementById("jAddress").value,
      wage: document.getElementById("jWage").value ? Number(document.getElementById("jWage").value) : null,
      wageType: document.getElementById("jWageType").value,
      startDate: document.getElementById("jStart").value || null,
      endDate: document.getElementById("jEnd").value || null,
      workingHours: document.getElementById("jHours").value,
      experienceRequired: Number(document.getElementById("jExp").value) || 0,
      urgency: document.getElementById("jUrgency").value,
      additionalRequirements: document.getElementById("jExtra").value,
    };
  }

  async function submitJob(publish){
    const payload = collect();
    if(!payload.title || !payload.city){ alert("Job title and city are required."); return; }
    try{
      if(editId){
        await Contralabos.marketplace.jobs.update(editId, payload);
        if(publish) await Contralabos.marketplace.jobs.publish(editId);
        window.location.href = "job-detail.html?id=" + editId;
      } else {
        payload.publish = publish;
        const job = await Contralabos.marketplace.jobs.create(payload);
        window.location.href = "job-detail.html?id=" + job.id;
      }
    }catch(err){ alert(err.message || t("ttl_Unable to publish job. Please try again.")); }
  }

  document.getElementById("jobForm").addEventListener("submit", (e) => { e.preventDefault(); submitJob(true); });
  document.getElementById("draftBtn").addEventListener("click", () => submitJob(false));

  document.addEventListener("shell:ready", async () => {
    if(!editId) return;
    document.getElementById("pageTitle").textContent = "Edit Job";
    document.getElementById("publishBtn").textContent = t("ttl_Update Job");
    const j = await Contralabos.marketplace.jobs.get(editId);
    if(!j) return;
    document.getElementById("jTitle").value = j.title || "";
    document.getElementById("jDesc").value = j.description || "";
    document.getElementById("jCategory").value = j.category || "";
    document.getElementById("jSkill").value = j.skillRequired || "";
    document.getElementById("jWorkerType").value = j.workerType || "";
    document.getElementById("jWorkersRequired").value = j.workersRequired || 1;
    document.getElementById("jCity").value = j.city || "";
    document.getElementById("jArea").value = j.area || "";
    document.getElementById("jAddress").value = j.address || "";
    document.getElementById("jWage").value = j.wage || "";
    document.getElementById("jWageType").value = j.wageType || "daily";
    document.getElementById("jStart").value = j.startDate || "";
    document.getElementById("jEnd").value = j.endDate || "";
    document.getElementById("jHours").value = j.workingHours || "";
    document.getElementById("jExp").value = j.experienceRequired || 0;
    document.getElementById("jUrgency").value = j.urgency || "";
    document.getElementById("jExtra").value = j.additionalRequirements || "";
  });
</script>
<script src="js/validate.js"></script>
</body>
</html>
