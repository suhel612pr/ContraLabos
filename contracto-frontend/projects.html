<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Projects — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="projects">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_projects">Projects</span></div>
<div class="page">
<div class="page-hero">
<img alt="Architectural blueprint and building model on a desk" src="images/projects.png"/>
<div class="page-hero-content">
<div class="eyebrow">Portfolio</div>
<h1 data-i18n="ttl_Projects in Progress">Projects in Progress</h1>
<p data-i18n="ttl_Every active build, tracked from foundation to handover.">Every active build, tracked from foundation to handover.</p>
</div>
</div>
<div class="page-head">
<div><div class="page-title" data-i18n="title_projects">Projects</div><div class="page-sub" data-i18n="sub_projects">All projects across your organization</div></div>
<div class="page-actions"><button class="btn btn-primary" id="newProjBtn">+ New Project</button></div>
</div>
<div class="panel">
<div class="table-toolbar">
<select id="fStatus"><option data-i18n="ttl_All Statuses" value="">All Statuses</option><option data-i18n="ttl_Active" value="active">Active</option><option data-i18n="ttl_Completed" value="completed">Completed</option></select>
<input id="fSearch" placeholder="Search project name…" type="text"/>
</div>
<div class="table-wrap">
<table class="data-table" id="projTable">
<thead><tr><th data-i18n="ttl_Project">Project</th><th data-i18n="ttl_Supervisor">Supervisor</th><th data-i18n="ttl_Start Date">Start Date</th><th data-i18n="ttl_Progress">Progress</th><th data-i18n="nav_budget">Budget</th><th data-i18n="ttl_Spent">Spent</th><th data-i18n="ttl_Status">Status</th><th></th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<div id="newProjOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;align-items:center;justify-content:center;">
<div class="panel" style="width:440px;margin:0;">
<div class="panel-head"><h3 data-i18n="ttl_New Project">New Project</h3><button class="btn btn-sm" id="closeProjBtn">✕</button></div>
<div class="panel-body">
<form id="projForm">
<div class="field"><label data-i18n="ttl_Project Name*">Project Name <span class="req">*</span></label><input id="npName" required="" type="text"/></div>
<div class="field"><label data-i18n="ttl_Budget (₹)*">Budget (₹) <span class="req">*</span></label><input id="npBudget" min="1" required="" type="number"/></div>
<div class="field"><label data-i18n="ttl_Start Date">Start Date</label><input id="npDate" type="date"/></div>
<button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">Create Project</button>
</form>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
  let all = [];
  function render(){
    const status = document.getElementById("fStatus").value;
    const search = document.getElementById("fSearch").value.toLowerCase();
    let rows = all;
    if(status) rows = rows.filter(p=>p.status===status);
    if(search) rows = rows.filter(p=>p.name.toLowerCase().includes(search));
    document.querySelector("#projTable tbody").innerHTML = rows.length ? rows.map(p => `
      <tr onclick="window.location.href='project-detail.html?id=${p.id}'">
        <td class="row-link">${p.name}</td><td>${p.supervisorId || "—"}</td>
        <td>${p.startDate}</td><td>${p.progress}%</td>
        <td class="num">${inr(p.budget)}</td><td class="num">${inr(p.spent)}</td>
        <td><span class="badge ${p.status==='active'?'review':'completed'}">${tBadge(p.status)}</span></td>
        <td><button class="btn btn-sm" onclick="event.stopPropagation(); deleteProject('${p.id}')">Delete</button></td>
      </tr>`).join("") : `<tr><td colspan="7" style="color:var(--c-text-dim);text-align:center;padding:32px;">No projects match these filters.</td></tr>`;
  }
  document.addEventListener("shell:ready", async () => { all = await Contralabos.projects.list(); render(); });
  document.getElementById("fStatus").addEventListener("change", render);
  document.getElementById("fSearch").addEventListener("input", render);
  document.addEventListener("languagechange:contralabos", render);
  document.getElementById("newProjBtn").addEventListener("click", () => document.getElementById("newProjOverlay").style.display = "flex");
  document.getElementById("closeProjBtn").addEventListener("click", () => document.getElementById("newProjOverlay").style.display = "none");
  window.deleteProject = async function(id){
    if(!confirm("Delete this project and all related records? This cannot be undone.")) return;
    try{
      await Contralabos.projects.remove(id);
      all = await Contralabos.projects.list();
      render();
    }catch(err){ alert(err.message || "Unable to delete project."); }
  };
  document.getElementById("projForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await Contralabos.projects.create({
      name: document.getElementById("npName").value,
      budget: Number(document.getElementById("npBudget").value),
      startDate: document.getElementById("npDate").value || new Date().toISOString().slice(0,10),
      supervisorId: null, progress: 0
    });
    window.location.reload();
  });
</script>
<script src="js/validate.js"></script>
</body>
</html>
