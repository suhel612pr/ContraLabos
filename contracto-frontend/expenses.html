<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Expenses — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="expenses">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_expenses">Expenses</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="title_expenses">Expenses</div><div class="page-sub" data-i18n="sub_expenses">Project expenses by category, vendor, and date</div></div>
<div class="page-actions"><button class="btn btn-primary" id="newExpBtn">+ Record Expense</button></div>
</div>
<div class="stat-row" id="statRow"></div>
<div class="panel">
<div class="table-toolbar">
<select id="fProject"><option data-i18n="ttl_All Projects" value="">All Projects</option></select>
<select id="fCategory"><option data-i18n="ttl_All Categories" value="">All Categories</option><option data-i18n="ttl_Transport">Transport</option><option data-i18n="ttl_Equipment Rental">Equipment Rental</option><option data-i18n="ttl_Site Utilities">Site Utilities</option><option data-i18n="ttl_Miscellaneous">Miscellaneous</option></select>
</div>
<div class="table-wrap">
<table class="data-table" id="expTable">
<thead><tr><th data-i18n="ttl_Date">Date</th><th data-i18n="ttl_Project">Project</th><th data-i18n="ttl_Category">Category</th><th data-i18n="ttl_Vendor">Vendor</th><th data-i18n="ttl_Amount">Amount</th><th data-i18n="ttl_Recorded By">Recorded By</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<div id="expOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;align-items:center;justify-content:center;">
<div class="panel" style="width:420px;margin:0;">
<div class="panel-head"><h3 data-i18n="ttl_Record Expense">Record Expense</h3><button class="btn btn-sm" id="closeExpBtn">✕</button></div>
<div class="panel-body">
<form id="expForm">
<div class="field"><label data-i18n="ttl_Project*">Project <span class="req">*</span></label><select id="eProject" required=""></select></div>
<div class="field"><label data-i18n="ttl_Category*">Category <span class="req">*</span></label>
<select id="eCategory" required=""><option data-i18n="ttl_Transport">Transport</option><option data-i18n="ttl_Equipment Rental">Equipment Rental</option><option data-i18n="ttl_Site Utilities">Site Utilities</option><option data-i18n="ttl_Miscellaneous">Miscellaneous</option></select>
</div>
<div class="field"><label data-i18n="ttl_Amount (₹)*">Amount (₹) <span class="req">*</span></label><input id="eAmount" min="1" required="" type="number"/></div>
<div class="field"><label data-i18n="ttl_Vendor / Payee">Vendor / Payee</label><input id="eVendor" type="text"/></div>
<div class="field"><label data-i18n="ttl_Receipt">Receipt</label><input id="eReceipt" type="file"/></div>
<button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">Save Expense</button>
</form>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
  let projects = [], all = [];
  const projName = (id) => (projects.find(p=>p.id===id)||{}).name || id;

  function render(){
    const proj = document.getElementById("fProject").value;
    const cat = document.getElementById("fCategory").value;
    let rows = all;
    if(proj) rows = rows.filter(x=>x.projectId===proj);
    if(cat) rows = rows.filter(x=>x.category===cat);
    document.querySelector("#expTable tbody").innerHTML = rows.length ? rows.map(x => `
      <tr><td>${x.date}</td><td>${projName(x.projectId)}</td><td>${x.category}</td><td>${x.vendor||"—"}</td>
      <td class="num">${inr(x.amount)}</td><td>${x.recordedBy || "—"}</td></tr>`).join("") : `<tr><td colspan="6" style="color:var(--c-text-dim);text-align:center;padding:32px;">No expenses match these filters.</td></tr>`;
    document.getElementById("statRow").innerHTML = `
      <div class="stat-cell"><div class="s-label">Total (filtered)</div><div class="s-value">${inr(rows.reduce((s,x)=>s+x.amount,0))}</div></div>
      <div class="stat-cell"><div class="s-label">Entries</div><div class="s-value">${rows.length}</div></div>
      <div class="stat-cell"><div class="s-label">Avg. per Entry</div><div class="s-value">${rows.length?inr(Math.round(rows.reduce((s,x)=>s+x.amount,0)/rows.length)):"₹0"}</div></div>
      <div class="stat-cell"><div class="s-label">Categories</div><div class="s-value">${new Set(rows.map(x=>x.category)).size}</div></div>`;
  }

  document.addEventListener("shell:ready", async () => {
    projects = await Contralabos.projects.list();
    all = await Contralabos.expenses.list();
    const opts = projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
    document.getElementById("fProject").innerHTML += opts;
    document.getElementById("eProject").innerHTML = opts;
    render();
  });
  ["fProject","fCategory"].forEach(id=>document.getElementById(id).addEventListener("change",render));
  document.getElementById("newExpBtn").addEventListener("click", () => document.getElementById("expOverlay").style.display="flex");
  document.getElementById("closeExpBtn").addEventListener("click", () => document.getElementById("expOverlay").style.display="none");
  document.getElementById("expForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try{
      await Contralabos.expenses.create({
        projectId: document.getElementById("eProject").value, category: document.getElementById("eCategory").value,
        amount: Number(document.getElementById("eAmount").value), vendor: document.getElementById("eVendor").value
      });
      window.location.reload();
    }catch(err){ alert(err.message || "Unable to save expense."); }
  });
</script>
<script src="js/validate.js"></script>
</body>
</html>
