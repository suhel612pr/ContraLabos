<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Reports — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="reports">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_reports">Reports</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="title_reports">Reports</div><div class="page-sub" data-i18n="sub_reports">Attendance, labour, material, inventory, expense, progress, and budget — filterable and exportable</div></div>
<div class="page-actions">
<button class="btn" id="printBtn">Print / PDF</button>
<button class="btn btn-primary" id="csvBtn">Export CSV</button>
</div>
</div>
<div class="panel">
<div class="table-toolbar">
<select id="reportType">
<option data-i18n="ttl_Attendance Report" value="attendance">Attendance Report</option>
<option data-i18n="ttl_Labour Payment Report" value="labour">Labour Payment Report</option>
<option data-i18n="ttl_Material Report" value="material">Material Report</option>
<option data-i18n="ttl_Inventory Report" value="inventory">Inventory Report</option>
<option data-i18n="ttl_Expense Report" value="expense">Expense Report</option>
<option data-i18n="ttl_Progress Report" value="progress">Progress Report</option>
<option data-i18n="ttl_Budget / Financial Summary" value="budget">Budget / Financial Summary</option>
</select>
<select id="fProject"><option data-i18n="ttl_All Projects" value="">All Projects</option></select>
<input id="fFrom" type="date"/>
<span style="color:var(--c-text-dim);font-size:11.5px;">to</span>
<input id="fTo" type="date"/>
</div>
<div class="panel-head"><h3 id="reportTitle">Attendance Report</h3><span id="rowCount" style="font-size:11px;color:var(--c-text-dim);"></span></div>
<div class="table-wrap">
<table class="data-table" id="reportTable"></table>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
  let ctx = { projects:[], workers:[], attendance:[], payments:[], receipts:[], usage:[], materials:[], expenses:[], progress:[] };
  let currentRows = [], currentHeaders = [];

  const REPORT_TITLES = {
    attendance:"Attendance Report", labour:"Labour Payment Report", material:"Material Report",
    inventory:"Inventory Report", expense:"Expense Report", progress:"Progress Report", budget:"Budget / Financial Summary"
  };

  function inRange(dateStr){
    const from = document.getElementById("fFrom").value, to = document.getElementById("fTo").value;
    if(from && dateStr < from) return false;
    if(to && dateStr > to) return false;
    return true;
  }

  function buildReport(){
    const type = document.getElementById("reportType").value;
    const proj = document.getElementById("fProject").value;
    document.getElementById("reportTitle").textContent = REPORT_TITLES[type];
    const projName = (id) => (ctx.projects.find(p=>p.id===id)||{}).name || id;
    const workerName = (id) => (ctx.workers.find(w=>w.id===id)||{}).name || id;
    const matName = (id) => (ctx.materials.find(m=>m.id===id)||{}).name || id;

    let headers = [], rows = [];

    if(type === "attendance"){
      headers = ["Date","Worker","Project","Status","Recorded By"];
      rows = ctx.attendance.filter(a => (!proj||a.projectId===proj) && inRange(a.date))
        .map(a => [a.date, workerName(a.workerId), projName(a.projectId), a.status, "Sunita Pawar"]);
    } else if(type === "labour"){
      headers = ["Worker","Project","Period","Amount","Status"];
      rows = ctx.payments.filter(p => !proj||p.projectId===proj)
        .map(p => [workerName(p.workerId), projName(p.projectId), p.period, inr(p.amount), p.status]);
    } else if(type === "material"){
      headers = ["Material","Project","Qty Received","Cost","Vendor","Date"];
      rows = ctx.receipts.filter(r => (!proj||r.projectId===proj) && inRange(r.date))
        .map(r => [matName(r.materialId), projName(r.projectId), r.quantity, inr(r.cost), r.vendor||"—", r.date]);
    } else if(type === "inventory"){
      headers = ["Material","Project","Received","Used","Remaining"];
      const projectsToShow = proj ? [proj] : ctx.projects.map(p=>p.id);
      projectsToShow.forEach(pid => {
        ctx.materials.forEach(m => {
          const received = ctx.receipts.filter(r=>r.projectId===pid && r.materialId===m.id).reduce((s,r)=>s+r.quantity,0);
          const used = ctx.usage.filter(u=>u.projectId===pid && u.materialId===m.id).reduce((s,u)=>s+u.quantity,0);
          if(received > 0 || used > 0) rows.push([m.name, projName(pid), received, used, received-used]);
        });
      });
    } else if(type === "expense"){
      headers = ["Date","Project","Category","Vendor","Amount"];
      rows = ctx.expenses.filter(e => (!proj||e.projectId===proj) && inRange(e.date))
        .map(e => [e.date, projName(e.projectId), e.category, e.vendor||"—", inr(e.amount)]);
    } else if(type === "progress"){
      headers = ["Date","Project","% Complete","Work Completed","Submitted By"];
      rows = ctx.progress.filter(p => (!proj||p.projectId===proj) && inRange(p.date))
        .map(p => [p.date, projName(p.projectId), p.percentage+"%", p.workCompleted, p.submittedBy]);
    } else if(type === "budget"){
      headers = ["Project","Budgeted","Total Spent","Remaining","% Used"];
      rows = ctx.projects.filter(p => !proj||p.id===proj)
        .map(p => [p.name, inr(p.budget), inr(p.spent), inr(p.budget-p.spent), Math.round(p.spent/p.budget*100)+"%"]);
    }

    currentHeaders = headers; currentRows = rows;
    document.getElementById("reportTable").innerHTML =
      "<thead><tr>" + headers.map(h=>`<th>${h}</th>`).join("") + "</tr></thead>" +
      "<tbody>" + (rows.length ? rows.map(r => "<tr>"+r.map(c=>`<td>${c}</td>`).join("")+"</tr>").join("") : `<tr><td colspan="${headers.length}" style="color:var(--c-text-dim);">No records match these filters.</td></tr>`) + "</tbody>";
    document.getElementById("rowCount").textContent = rows.length + " rows";
  }

  document.addEventListener("shell:ready", async () => {
    const [projects, workers, materials] = await Promise.all([Contralabos.projects.list(), Contralabos.workers.list(), Contralabos.materials.catalog()]);
    ctx.projects = projects; ctx.workers = workers; ctx.materials = materials;
    ctx.attendance = [];
    for(const p of projects){ ctx.attendance = ctx.attendance.concat(await Contralabos.attendance.listByProject(p.id)); }
    ctx.payments = await Contralabos.payments.list();
    ctx.receipts = await Contralabos.materials.receipts();
    ctx.usage = await Contralabos.materials.usage();
    ctx.expenses = await Contralabos.expenses.list();
    ctx.progress = await Contralabos.progress.list();
    document.getElementById("fProject").innerHTML += projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
    buildReport();
  });

  ["reportType","fProject","fFrom","fTo"].forEach(id => document.getElementById(id).addEventListener("change", buildReport));

  document.getElementById("printBtn").addEventListener("click", () => window.print());
  document.getElementById("csvBtn").addEventListener("click", () => {
    const csv = [currentHeaders.join(",")].concat(
      currentRows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(","))
    ).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = document.getElementById("reportType").value + "-report.csv";
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
