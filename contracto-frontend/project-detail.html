<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Project Detail — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
<style>
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--c-border);margin-bottom:20px;}
  .tab{padding:10px 16px;font-size:12.5px;font-weight:600;color:var(--c-text-muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--c-gold-light);border-bottom-color:var(--c-gold);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
</style>
</head>
<body data-page="projects">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><a href="projects.html">Projects</a><span class="sep">/</span><span class="current" id="bcName">—</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="pTitle">Project</div><div class="page-sub" id="pSub">—</div></div>
</div>
<div class="stat-row" id="statRow"></div>
<div class="tabs">
<div class="tab active" data-tab="overview">Overview</div>
<div class="tab" data-tab="workers">Workers</div>
<div class="tab" data-tab="attendance">Attendance</div>
<div class="tab" data-tab="budget">Budget</div>
<div class="tab" data-tab="documents">Documents</div>
</div>
<div class="tab-panel active" id="tab-overview">
<div class="contact-card" id="supervisorContact"></div>
<div class="panel"><div class="panel-head"><h3 data-i18n="ttl_Progress">Progress</h3></div><div id="skylineHost"></div></div>
</div>
<div class="tab-panel" id="tab-workers">
<div class="panel"><div class="panel-head"><h3 data-i18n="ttl_Assigned Workers">Assigned Workers</h3></div>
<div class="table-wrap"><table class="data-table" id="workerTable"><thead><tr><th data-i18n="ttl_Name">Name</th><th data-i18n="ttl_Wage Rate/Day">Wage Rate/Day</th><th data-i18n="ttl_Status">Status</th></tr></thead><tbody></tbody></table></div>
</div>
</div>
<div class="tab-panel" id="tab-attendance">
<div class="panel"><div class="panel-head"><h3 data-i18n="ttl_Attendance Log">Attendance Log</h3></div>
<div class="table-wrap"><table class="data-table" id="attTable"><thead><tr><th data-i18n="ttl_Date">Date</th><th data-i18n="ttl_Worker">Worker</th><th data-i18n="ttl_Status">Status</th></tr></thead><tbody></tbody></table></div>
</div>
</div>
<div class="tab-panel" id="tab-budget">
<div class="panel"><div class="panel-head"><h3 data-i18n="ttl_Budget vs Actual">Budget vs Actual</h3></div>
<div class="panel-body"><table class="data-table"><tbody id="budgetTable"></tbody></table></div>
</div>
</div>
<div class="tab-panel" id="tab-documents">
<div class="panel"><div class="panel-head"><h3 data-i18n="ttl_Project Documents">Project Documents</h3></div>
<div class="table-wrap"><table class="data-table" id="docTable"><thead><tr><th data-i18n="ttl_File">File</th><th data-i18n="ttl_Category">Category</th><th data-i18n="ttl_Date">Date</th></tr></thead><tbody></tbody></table></div>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/charts.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
  const params = new URLSearchParams(window.location.search);
  const pid = params.get("id") || ProjectContext.get() || "p1";
  ProjectContext.set(pid);

  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("tab-"+t.dataset.tab).classList.add("active");
  }));

  let _pdProject, _pdWorkers, _pdAtt, _pdDocs, _pdUsers;

  function renderProjectDetail(){
    const p = _pdProject;
    if(!p) return;
    document.getElementById("bcName").textContent = p.name;
    document.getElementById("pTitle").textContent = p.name;
    document.getElementById("pSub").textContent = t("ttl_Started") + " " + p.startDate + " · " + tBadge(p.status);

    const sup = _pdUsers.find(u=>u.id===p.supervisorId);
    if(sup){
      document.getElementById("supervisorContact").innerHTML = `
        <div class="c-avatar">${sup.avatarInitials||"S"}</div>
        <div><div class="c-name">${sup.name}</div><div class="c-role">${t("ttl_Site Supervisor")} · ${p.name}</div></div>
        <div class="c-actions">
          ${sup.phone ? `<a class="call-btn" href="tel:${sup.phone.replace(/\s/g,'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 2.9a2 2 0 01-.4 2.1L8.1 9.9a16 16 0 006 6l1.2-1.2a2 2 0 012.1-.4c.9.4 1.9.6 2.9.7a2 2 0 011.7 2z"/></svg>Call ${sup.phone}</a>` : ""}
        </div>`;
    }

    document.getElementById("statRow").innerHTML = `
      <div class="stat-cell"><div class="s-label">${t("ttl_Progress")}</div><div class="s-value">${p.progress}%</div></div>
      <div class="stat-cell"><div class="s-label">${t("ttl_Budget")}</div><div class="s-value">${inr(p.budget)}</div></div>
      <div class="stat-cell"><div class="s-label">${t("ttl_Spent")}</div><div class="s-value">${inr(p.spent)}</div></div>
      <div class="stat-cell"><div class="s-label">${t("ttl_Remaining")}</div><div class="s-value">${inr(p.budget-p.spent)}</div></div>`;

    renderSkyline("skylineHost", [
      {label:t("ttl_Budget"), value:p.budget, max:p.budget, display:inr(p.budget), title:t("ttl_Total Budget"),
       detail:`${t("ttl_The total amount allocated for")} ${p.name}.`},
      {label:t("ttl_Spent"), value:p.spent, max:p.budget, display:inr(p.spent), title:t("ttl_Total Spent"),
       detail:`${Math.round(p.spent/p.budget*100)}% ${t("ttl_of budget used so far")} — ${t("ttl_combines labour, materials, and expenses")}.`},
      {label:t("ttl_Remaining"), value:p.budget-p.spent, max:p.budget, display:inr(p.budget-p.spent), title:t("ttl_Remaining Budget"),
       detail:`${t("ttl_Budget minus total spent")}. ${p.budget-p.spent < p.budget*0.1 ? t("ttl_Running low") : t("ttl_Healthy margin remaining")}.`}
    ]);

    const wName = (id) => (_pdWorkers.find(w=>w.id===id)||{}).name || id;
    document.querySelector("#workerTable tbody").innerHTML = _pdWorkers.filter(w=>w.projectId===pid).map(w => `
      <tr><td>${w.name}</td><td class="num">${inr(w.wageRate)}</td><td><span class="badge approved">${tBadge(w.status)}</span></td></tr>`).join("");

    document.querySelector("#attTable tbody").innerHTML = _pdAtt.map(a => `
      <tr><td>${a.date}</td><td>${wName(a.workerId)}</td><td><span class="badge ${a.status==='present'?'approved':'pending'}">${tBadge(a.status)}</span></td></tr>`).join("");

    document.getElementById("budgetTable").innerHTML = `
      <tr><td style="color:var(--c-text-dim);width:160px;">${t("ttl_Budgeted Amount")}</td><td>${inr(p.budget)}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Total Spent")}</td><td>${inr(p.spent)}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Remaining Budget")}</td><td>${inr(p.budget-p.spent)}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_% Used")}</td><td>${Math.round(p.spent/p.budget*100)}%</td></tr>`;

    document.querySelector("#docTable tbody").innerHTML = _pdDocs.filter(d=>d.projectId===pid).map(d => `
      <tr><td>📄 ${d.name}</td><td>${d.category}</td><td>${d.date}</td></tr>`).join("") || `<tr><td colspan='3' style='color:var(--c-text-dim);'>${t("ttl_No documents yet")}.</td></tr>`;
  }

  document.addEventListener("shell:ready", async () => {
    _pdProject = await Contralabos.projects.get(pid);
    if(!_pdProject){ document.querySelector(".page").innerHTML = "<p>Project not found.</p>"; return; }
    _pdWorkers = await Contralabos.workers.list();
    _pdAtt = await Contralabos.attendance.listByProject(pid);
    _pdDocs = await Contralabos.documents.list();
    _pdUsers = await Contralabos.users.list();
    renderProjectDetail();
  });

  document.addEventListener("languagechange:contralabos", renderProjectDetail);
</script>
</body>
</html>
