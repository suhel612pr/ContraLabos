<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Notifications — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="notifications">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_notifications">Notifications</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="title_notifications">Notifications</div><div class="page-sub" data-i18n="sub_notifications">Attendance gaps, low stock, pending requests, and progress submissions</div></div>
<div class="page-actions"><button class="btn" id="markAllBtn">Mark all as read</button></div>
</div>
<div class="panel">
<div class="activity-log" id="notifList" style="border-top:none;"></div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<style>
  .notif-row{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--c-border-soft);align-items:flex-start;}
  .notif-row.unread{background:var(--c-gold-dim);}
  .notif-icon{width:30px;height:30px;border:1px solid var(--c-border);border-radius:var(--r-xs);display:flex;align-items:center;justify-content:center;color:var(--c-gold);flex-shrink:0;}
  .notif-title{font-size:12.5px;}
  .notif-time{font-size:10.5px;color:var(--c-text-dim);font-family:var(--f-mono);margin-top:3px;}
</style>
<script>
  const TYPE_ICON = {request:"📋", stock:"📦", progress:"🏗", attendance:"🕓"};
  async function render(){
    const list = await Contralabos.notifications.list();
    document.getElementById("notifList").innerHTML = list.map(n => `
      <div class="notif-row ${n.read?'':'unread'}">
        <div class="notif-icon">${TYPE_ICON[n.type]||"🔔"}</div>
        <div><div class="notif-title">${n.title}</div><div class="notif-time">${new Date(n.at).toLocaleString("en-IN")}</div></div>
      </div>`).join("");
  }
  document.addEventListener("shell:ready", render);
  document.getElementById("markAllBtn").addEventListener("click", async () => {
    const list = await Contralabos.notifications.list();
    for(const n of list) await Contralabos.notifications.markRead(n.id);
    render();
  });
</script>
</body>
</html>
