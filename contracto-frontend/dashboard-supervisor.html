<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Dashboard — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="dashboard">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard-supervisor.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_dashboard">Dashboard</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="greetName">Welcome back</div><div class="page-sub" data-i18n="ttl_Assigned Sites: 2 · Today's attendance not yet logged for Wagholi Commercial Plaza">Assigned Sites: 2 · Today's attendance not yet logged for Wagholi Commercial Plaza</div></div>
<div class="page-actions">
<button class="btn btn-primary" data-i18n="ttl_Log Attendance" onclick="window.location.href='attendance.html'">Log Attendance</button>
<button class="btn" data-i18n="ttl_Submit Progress" onclick="window.location.href='progress.html'">Submit Progress</button>
</div>
</div>
<div class="stat-row">
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Assigned Projects">Assigned Projects</div><div class="s-value">2</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Workers On Site Today">Workers On Site Today</div><div class="s-value">18</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Requests Submitted">Requests Submitted</div><div class="s-value">3</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Pending Approval">Pending Approval</div><div class="s-value">2</div></div>
</div>
<div class="contact-card" id="contractorContact"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_My Assigned Projects">My Assigned Projects</h3></div>
<div class="table-wrap">
<table class="data-table" id="projTable">
<thead><tr><th data-i18n="ttl_Project">Project</th><th data-i18n="ttl_Progress">Progress</th><th data-i18n="ttl_Status">Status</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_My Recent Requests">My Recent Requests</h3><div class="panel-tools"><button class="btn btn-sm" data-i18n="ttl_View all" onclick="window.location.href='requests.html'">View all</button></div></div>
<div class="table-wrap">
<table class="data-table" id="reqTable">
<thead><tr><th data-i18n="ttl_ID">ID</th><th data-i18n="ttl_Type">Type</th><th data-i18n="ttl_Status">Status</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  let _svUser, _svProjects, _svReqs;

  function renderSupervisorGreeting(){
    if(_svUser) document.getElementById("greetName").textContent = t("greeting_welcome_back") + ", " + _svUser.name.split(" ")[0];
    const roleLabel = document.getElementById("contractorRoleLabel");
    if(roleLabel) roleLabel.textContent = t("ttl_Contractor / Owner");
  }

  function renderSupervisorTables(){
    if(_svProjects) document.querySelector("#projTable tbody").innerHTML = _svProjects.slice(0,3).map(p => `
      <tr onclick="window.location.href='project-detail.html?id=${p.id}'">
        <td class="row-link">${p.name}</td><td>${p.progress}%</td>
        <td><span class="badge ${p.status==='active'?'review':'completed'}">${tBadge(p.status)}</span></td>
      </tr>`).join("");
    if(_svReqs) document.querySelector("#reqTable tbody").innerHTML = _svReqs.slice(0,4).map(r => `
      <tr onclick="window.location.href='request-detail.html?id=${r.id}'">
        <td class="row-link">${r.id}</td><td>${tBadge(r.type)}</td><td><span class="badge ${r.status}">${tBadge(r.status)}</span></td>
      </tr>`).join("");
  }

  document.addEventListener("shell:ready", async (e) => {
    _svUser = e.detail.user;
    renderSupervisorGreeting();
    const users = await Contralabos.users.list();
    const contractor = users.find(u=>u.role==="contractor");
    if(contractor){
      document.getElementById("contractorContact").innerHTML = `
        <div class="c-avatar">${contractor.avatarInitials||"C"}</div>
        <div><div class="c-name">${contractor.name}</div><div class="c-role" id="contractorRoleLabel">${t("ttl_Contractor / Owner")}</div></div>
        <div class="c-actions">
          ${contractor.phone ? `<a class="call-btn" href="tel:${contractor.phone.replace(/\s/g,'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 2.9a2 2 0 01-.4 2.1L8.1 9.9a16 16 0 006 6l1.2-1.2a2 2 0 012.1-.4c.9.4 1.9.6 2.9.7a2 2 0 011.7 2z"/></svg>Call ${contractor.phone}</a>` : ""}
        </div>`;
    }
    _svProjects = await Contralabos.projects.list();
    _svReqs = await Contralabos.requests.list();
    renderSupervisorTables();
  });

  document.addEventListener("languagechange:contralabos", () => { renderSupervisorGreeting(); renderSupervisorTables(); });
</script>
</body>
</html>
