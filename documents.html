<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Documents — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="documents">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_documents">Documents</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="title_documents">Documents</div><div class="page-sub" data-i18n="sub_documents">Contracts, receipts, certificates, and progress media — uploaded once, reused everywhere</div></div>
<div class="page-actions"><button class="btn btn-primary" id="uploadBtn">+ Upload Document</button></div>
</div>
<div class="panel">
<div class="table-toolbar">
<select id="fCat"><option data-i18n="ttl_All Categories" value="">All Categories</option><option data-i18n="ttl_Organization">Organization</option><option data-i18n="ttl_Contract">Contract</option><option data-i18n="ttl_Receipt">Receipt</option><option data-i18n="ttl_Progress Media">Progress Media</option></select>
<input id="fSearch" placeholder="Search file name…" type="text"/>
</div>
<div class="table-wrap">
<table class="data-table" id="docTable">
<thead><tr><th data-i18n="ttl_File">File</th><th data-i18n="ttl_Category">Category</th><th data-i18n="ttl_Project">Project</th><th data-i18n="ttl_Uploaded By">Uploaded By</th><th data-i18n="ttl_Date">Date</th><th></th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<div id="uploadOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;align-items:center;justify-content:center;">
<div class="panel" style="width:420px;margin:0;">
<div class="panel-head"><h3 data-i18n="ttl_Upload Document">Upload Document</h3><button class="btn btn-sm" id="closeUploadBtn">✕</button></div>
<div class="panel-body">
<form id="uploadForm">
<div class="field"><label data-i18n="ttl_File*">File <span class="req">*</span></label><input id="upFile" required="" type="file"/></div>
<div class="field"><label data-i18n="ttl_Category*">Category <span class="req">*</span></label>
<select id="upCategory" required=""><option data-i18n="ttl_Organization">Organization</option><option data-i18n="ttl_Contract">Contract</option><option data-i18n="ttl_Receipt">Receipt</option><option data-i18n="ttl_Certificate">Certificate</option><option data-i18n="ttl_Progress Media">Progress Media</option></select>
</div>
<div class="field"><label data-i18n="ttl_Project">Project</label><select id="upProject"><option data-i18n="ttl_Organization-level (no project)" value="">Organization-level (no project)</option></select></div>
<button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">Upload</button>
</form>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  let docs = [], projects = [];
  function render(){
    const cat = document.getElementById("fCat").value;
    const search = document.getElementById("fSearch").value.toLowerCase();
    let rows = docs;
    if(cat) rows = rows.filter(d=>d.category===cat);
    if(search) rows = rows.filter(d=>d.name.toLowerCase().includes(search));
    const projName = (id) => id ? (projects.find(p=>p.id===id)||{}).name || id : "Organization-level";
    document.querySelector("#docTable tbody").innerHTML = rows.length ? rows.map(d => `
      <tr><td>📄 ${d.name}</td><td>${d.category}</td><td>${projName(d.projectId)}</td><td>${d.uploadedBy}</td><td>${d.date}</td>
      <td><button class="btn btn-sm" onclick="alert('${d.name.replace(/'/g,"")}\\n\\nIn a live deployment this opens the stored file from cloud storage.')">View</button></td></tr>`).join("") : `<tr><td colspan="6" style="color:var(--c-text-dim);text-align:center;padding:32px;">No documents match these filters.</td></tr>`;
  }
  document.addEventListener("shell:ready", async () => {
    docs = await Contralabos.documents.list();
    projects = await Contralabos.projects.list();
    document.getElementById("upProject").innerHTML += projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
    render();
  });
  document.getElementById("fCat").addEventListener("change", render);
  document.getElementById("fSearch").addEventListener("input", render);

  document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("uploadOverlay").style.display="flex");
  document.getElementById("closeUploadBtn").addEventListener("click", () => document.getElementById("uploadOverlay").style.display="none");
  document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = document.getElementById("upFile").files[0];
    if(!file) return;
    if(file.size > 5 * 1024 * 1024){ alert("Please choose a file under 5MB."); return; }
    try{
      await Contralabos.documents.upload({
        file: file,
        category: document.getElementById("upCategory").value,
        projectId: document.getElementById("upProject").value || null
      });
      document.getElementById("uploadOverlay").style.display = "none";
      docs = await Contralabos.documents.list();
      render();
    }catch(err){ alert(err.message || "Unable to upload document."); }
  });
</script>
<script src="js/validate.js"></script>
</body>
</html>
