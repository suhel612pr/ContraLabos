<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>My Dashboard — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="dashboard">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard-worker.html">Home</a><span class="sep">/</span><span class="current" data-i18n="ttl_My Dashboard">My Dashboard</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="greetName">Welcome back</div><div class="page-sub" id="workerSummary">Your attendance and payment information</div></div>
<div class="page-actions"><button class="btn btn-primary" onclick="window.location.href='find-jobs.html'" data-i18n="nav_findjobs">Find Jobs</button></div>
</div>
<div class="panel" style="margin-bottom:20px;">
<div class="panel-head">
<h3 data-i18n="ttl_Labour Marketplace">Labour Marketplace</h3>
<button class="btn btn-sm btn-primary" onclick="window.location.href='find-jobs.html'" data-i18n="nav_findjobs">Find Jobs</button>
</div>
<div class="panel-body">
<div class="stat-row" id="mktStatRow" style="margin-bottom:0;"></div>
</div>
</div>
<div class="stat-row">
<div class="stat-cell"><div class="s-label" id="daysPresentLabel">Days Present</div><div class="s-value" id="daysPresentValue">—</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Wage Rate / Day">Wage Rate / Day</div><div class="s-value" id="wageRateValue">—</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Accrued Wages">Accrued Wages</div><div class="s-value" id="accruedWagesValue">—</div></div>
<div class="stat-cell"><div class="s-label" data-i18n="ttl_Pending Payment">Pending Payment</div><div class="s-value" id="pendingPaymentValue">—</div></div>
</div>
<div class="contact-card" id="supervisorContact"></div>
<div style="display:grid;grid-template-columns:1.3fr 1fr;gap:20px;">
<div class="panel">
<div class="panel-head"><h3 id="attendanceHeading">My Attendance</h3></div>
<div class="table-wrap">
<table class="data-table" id="attTable">
<thead><tr><th data-i18n="ttl_Date">Date</th><th data-i18n="ttl_Status">Status</th><th data-i18n="ttl_Recorded By">Recorded By</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Payment History">Payment History</h3></div>
<div class="table-wrap">
<table class="data-table">
<thead><tr><th data-i18n="ttl_Period">Period</th><th data-i18n="ttl_Amount">Amount</th><th data-i18n="ttl_Status">Status</th></tr></thead>
<tbody id="paymentTableBody"></tbody>
</table>
</div>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function renderGreeting(){
    const user = window._dwUser;
    if(user) document.getElementById("greetName").textContent = t("greeting_welcome_back") + ", " + user.name.split(" ")[0];
    const roleLabel = document.getElementById("supRoleLabel");
    if(roleLabel) roleLabel.textContent = t("ttl_Your Site Supervisor");
  }
  const money = amount => "₹" + Number(amount || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
  const monthPeriod = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;

  document.addEventListener("shell:ready", async (e) => {
    const user = e.detail.user;
    window._dwUser = user;
    renderGreeting();
    const [users, allWorkers, projects] = await Promise.all([
      Contralabos.users.list(),
      Contralabos.workers.list(),
      Contralabos.projects.list()
    ]);
    const workerRecord = allWorkers.find(worker => worker.userId === user.id);
    const hires = workerRecord?.projectId ? [] : await Contralabos.marketplace.hires.forWorker();
    const activeHire = hires.find(hire => hire.status === "active" && hire.workerRowId);
    const workerId = workerRecord ? workerRecord.id : activeHire?.workerRowId;
    const workerProjectId = workerRecord?.projectId || activeHire?.job?.projectId || null;
    const wageRate = workerRecord?.wageRate ?? (activeHire?.job?.wageType === "daily" ? activeHire.agreedWage : null);
    const [att, payments] = workerId
      ? await Promise.all([
        Contralabos.attendance.listByWorker(workerId),
        Contralabos.payments.list({ workerId })
      ])
      : [[], []];
    const currentDate = new Date();
    const currentPeriod = monthPeriod(currentDate);
    const currentMonthAttendance = att.filter(entry => entry.date.slice(0, 7) === currentPeriod);
    const presentDays = currentMonthAttendance.reduce((days, entry) =>
      days + (entry.status === "present" ? 1 : entry.status === "half_day" ? 0.5 : 0), 0);
    const accruedWages = wageRate === null ? null : presentDays * wageRate;
    const pendingPayment = payments.filter(payment => payment.status === "unpaid")
      .reduce((total, payment) => total + payment.amount, 0);
    const currentMonthName = currentDate.toLocaleDateString(undefined, { month: "long" });

    document.getElementById("workerSummary").textContent = workerProjectId
      ? projects.find(project => project.id === workerProjectId)?.name || "Your assigned project"
      : "No project is currently assigned to your worker record.";
    document.getElementById("daysPresentLabel").textContent = `Days Present (${currentDate.toLocaleDateString(undefined, { month: "short" })})`;
    document.getElementById("daysPresentValue").textContent = String(presentDays);
    document.getElementById("wageRateValue").textContent = wageRate === null ? "—" : money(wageRate);
    document.getElementById("accruedWagesValue").textContent = accruedWages === null ? "—" : money(accruedWages);
    document.getElementById("pendingPaymentValue").textContent = money(pendingPayment);
    document.getElementById("attendanceHeading").textContent = `My Attendance — ${currentMonthName} ${currentDate.getFullYear()}`;

    const project = projects.find(item => item.id === workerProjectId);
    const supervisor = project?.supervisorId ? users.find(item => item.id === project.supervisorId) : null;
    renderSupervisorContact(supervisor, project);
    window._dwAtt = currentMonthAttendance;
    window._dwPayments = payments;
    window._dwUsers = users;
    renderAttTable();
    renderPaymentTable();
    renderMarketplaceStats();
  });

  async function renderMarketplaceStats(){
    try{
      const [apps, offers, hires] = await Promise.all([
        Contralabos.marketplace.applications.mine(),
        Contralabos.marketplace.offers.receivedByMe(),
        Contralabos.marketplace.hires.forWorker(),
      ]);
      const pendingApps = apps.filter(a => ["pending","viewed","shortlisted"].includes(a.status)).length;
      const pendingOffers = offers.filter(o => o.status === "pending").length;
      const activeWork = hires.filter(h => h.status === "active").length;
      const el = document.getElementById("mktStatRow");
      if(el) el.innerHTML = `
        <div class="stat-cell" style="cursor:pointer;" onclick="window.location.href='my-applications.html'"><div class="s-label">${t("nav_myapplications")}</div><div class="s-value">${pendingApps}</div></div>
        <div class="stat-cell" style="cursor:pointer;" onclick="window.location.href='offers.html'"><div class="s-label">${t("nav_offers")}</div><div class="s-value">${pendingOffers}</div></div>
        <div class="stat-cell" style="cursor:pointer;" onclick="window.location.href='my-work.html'"><div class="s-label">${t("nav_mywork")}</div><div class="s-value">${activeWork}</div></div>`;
    }catch(err){ console.error("Marketplace stats failed to load:", err); }
  }

  function renderAttTable(){
    const att = window._dwAtt;
    if(!att) return;
    document.querySelector("#attTable tbody").innerHTML = att.length ? att.map(a => {
      const recorder = (window._dwUsers || []).find(person => person.id === a.recordedBy);
      return `<tr><td>${a.date}</td><td><span class="badge ${a.status==='present'?'approved':a.status==='absent'?'rejected':'pending'}">${tBadge(a.status)}</span></td><td>${recorder ? recorder.name : "Site team"}</td></tr>`;
    }).join("") : '<tr><td colspan="3" style="color:var(--c-text-dim);text-align:center;padding:24px;">No attendance recorded this month.</td></tr>';
  }

  function renderPaymentTable(){
    const payments = window._dwPayments || [];
    document.getElementById("paymentTableBody").innerHTML = payments.length ? payments.map(payment => `
      <tr><td>${payment.period}</td><td class="num">${money(payment.amount)}</td><td><span class="badge ${payment.status === "paid" ? "completed" : "pending"}">${tBadge(payment.status)}</span></td></tr>`).join("")
      : '<tr><td colspan="3" style="color:var(--c-text-dim);text-align:center;padding:24px;">No payments recorded yet.</td></tr>';
  }

  function renderSupervisorContact(supervisor, project){
    const card = document.getElementById("supervisorContact");
    card.replaceChildren();
    if(!supervisor){
      card.textContent = project ? "No site supervisor is assigned to your project." : "Supervisor contact will appear when you are assigned to a project.";
      return;
    }
    const avatar = document.createElement("div");
    avatar.className = "c-avatar";
    avatar.textContent = supervisor.avatarInitials || supervisor.name.slice(0, 1);
    const details = document.createElement("div");
    const name = document.createElement("div");
    name.className = "c-name";
    name.textContent = supervisor.name;
    const role = document.createElement("div");
    role.className = "c-role";
    role.textContent = t("ttl_Your Site Supervisor");
    details.append(name, role);
    card.append(avatar, details);
    if(supervisor.phone){
      const actions = document.createElement("div");
      actions.className = "c-actions";
      const link = document.createElement("a");
      link.className = "call-btn";
      link.href = `tel:${supervisor.phone.replace(/\s/g, "")}`;
      link.textContent = `Call ${supervisor.phone}`;
      actions.append(link);
      card.append(actions);
    }
  }

  document.addEventListener("languagechange:contralabos", () => { renderGreeting(); renderAttTable(); renderPaymentTable(); });
</script>
</body>
</html>
