<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Request Detail — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="requests">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><a href="requests.html">Requests</a><span class="sep">/</span><span class="current" id="bcId">—</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="reqTitle">Request</div><div class="page-sub" id="reqSub">—</div></div>
<div class="page-actions" id="actionButtons"></div>
</div>
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Status">Status</h3><span class="badge" id="statusBadge">—</span></div>
<div class="stepper" id="stepper"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Request Details">Request Details</h3></div>
<div class="panel-body">
<table class="data-table" style="border:none;">
<tbody id="detailTable"></tbody>
</table>
</div>
</div>
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Activity Log">Activity Log</h3></div>
<div class="activity-log" id="activityLog"></div>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
  const STAGES = ["submitted","review","approved","completed"];

  const params = new URLSearchParams(window.location.search);
  const reqId = params.get("id");

  let _rdUser, _rdReq, _rdProj;

  function renderRequestDetail(){
    const r = _rdReq, proj = _rdProj, user = _rdUser;
    if(!r) return;

    document.getElementById("bcId").textContent = r.id;
    document.getElementById("reqTitle").textContent = r.id + " — " + tBadge(r.type) + " " + t("ttl_Request");
    document.getElementById("reqSub").textContent = proj.name + " · " + t("ttl_Raised By") + " " + r.raisedBy;
    document.getElementById("statusBadge").textContent = tBadge(r.status);
    document.getElementById("statusBadge").className = "badge " + r.status;

    document.getElementById("detailTable").innerHTML = `
      <tr><td style="color:var(--c-text-dim);width:140px;">${t("ttl_Amount")}</td><td>${inr(r.amount)}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Project")}</td><td>${proj.name}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Type")}</td><td>${tBadge(r.type)}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Submitted")}</td><td>${new Date(r.createdAt).toLocaleString("en-IN")}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Note")}</td><td>${r.note || "—"}</td></tr>`;

    const isRejected = r.status === "rejected";
    const currentIdx = isRejected ? 1 : STAGES.indexOf(r.status);
    const stepperHtml = (isRejected ? ["submitted","review","rejected"] : STAGES).map((stage, i) => {
      const hist = r.history.find(h=>h.stage===stage);
      const state = isRejected ? (i < 2 ? "done" : "current") : (i < currentIdx ? "done" : i === currentIdx ? (currentIdx===STAGES.length-1?"done":"current") : "");
      return `<div class="step ${state}">
        <div class="dot">${state==="done" ? "✓" : i+1}</div>
        <div class="s-label">${tBadge(stage)}</div>
        <div class="s-date">${hist ? new Date(hist.at).toLocaleDateString("en-IN",{day:"2-digit",month:"short"}) : "—"}</div>
      </div>`;
    }).join("");
    document.getElementById("stepper").innerHTML = stepperHtml;

    document.getElementById("activityLog").innerHTML = r.history.map(h => `
      <div class="activity-item">
        <span class="a-time">${new Date(h.at).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
        <div><span class="a-who">${h.by}</span> ${t("ttl_marked as")} <strong>${tBadge(h.stage)}</strong>${h.note ? " — "+h.note : ""}</div>
      </div>`).join("");

    const actions = document.getElementById("actionButtons");
    if((user.role === "accountant" || user.role === "contractor") && r.status === "submitted"){
      actions.innerHTML = `<button class="btn" id="btnReview">${t("ttl_Mark Under Review")}</button>`;
      document.getElementById("btnReview").addEventListener("click", async () => {
        await Contralabos.requests.advance(r.id, "review", user.name);
        window.location.reload();
      });
    } else if(user.role === "contractor" && r.status === "review"){
      actions.innerHTML = `<button class="btn btn-danger" id="btnReject">${t("ttl_Reject")}</button><button class="btn btn-primary" id="btnApprove">${t("ttl_Approve")}</button>`;
      document.getElementById("btnApprove").addEventListener("click", async () => {
        await Contralabos.requests.advance(r.id, "approved", user.name);
        window.location.reload();
      });
      document.getElementById("btnReject").addEventListener("click", async () => {
        await Contralabos.requests.advance(r.id, "rejected", user.name);
        window.location.reload();
      });
    } else if(user.role === "contractor" && r.status === "approved"){
      actions.innerHTML = `<button class="btn btn-primary" id="btnComplete">${t("ttl_Mark Completed / Paid")}</button>`;
      document.getElementById("btnComplete").addEventListener("click", async () => {
        await Contralabos.requests.advance(r.id, "completed", user.name);
        window.location.reload();
      });
    }
  }

  document.addEventListener("shell:ready", async (e) => {
    _rdUser = e.detail.user;
    _rdReq = await Contralabos.requests.get(reqId);
    if(!_rdReq){ document.querySelector(".page").innerHTML = "<p>Request not found.</p>"; return; }
    const projects = await Contralabos.projects.list();
    _rdProj = projects.find(p=>p.id===_rdReq.projectId) || {};
    renderRequestDetail();
  });

  document.addEventListener("languagechange:contralabos", renderRequestDetail);
</script>
</body>
</html>
