<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Job Detail — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="jobdetail">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html" id="bcHome">Home</a><span class="sep">/</span><span class="current" id="bcTitle">Job</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="jobTitle">—</div><div class="page-sub" id="jobSub">—</div></div>
<div class="page-actions" id="actionButtons"></div>
</div>
<div class="stat-row" id="statRow"></div>
<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:20px;">
<div class="panel">
<div class="panel-head"><h3 data-i18n="ttl_Job Details">Job Details</h3><span class="badge" id="statusBadge">—</span></div>
<div class="panel-body">
<table class="data-table" style="border:none;">
<tbody id="detailTable"></tbody>
</table>
</div>
</div>
<div class="panel">
<div class="panel-head"><h3 id="sideTitle">Apply</h3></div>
<div class="panel-body" id="sideBody"></div>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return n === null || n === undefined ? "—" : "₹" + Number(n).toLocaleString("en-IN"); }
  const params = new URLSearchParams(window.location.search);
  const jobId = params.get("id");
  let _user, _job, _myApp, _myOffer;

  async function render(){
    const j = _job;
    if(!j) return;
    const roleHome = { contractor:"dashboard.html", worker:"dashboard-worker.html" }[_user.role] || "dashboard.html";
    document.getElementById("bcHome").href = roleHome;
    document.getElementById("bcTitle").textContent = j.title;
    document.getElementById("jobTitle").textContent = j.title;
    document.getElementById("jobSub").textContent = `${j.orgName || j.contractorName || ""} · ${j.city || ""}${j.area ? ", "+j.area : ""}`;
    document.getElementById("statusBadge").className = "badge " + badgeClass(j.status);
    document.getElementById("statusBadge").textContent = tBadge(j.status);

    document.getElementById("statRow").innerHTML = `
      <div class="stat-cell"><div class="s-label">${t("ttl_Workers Required")}</div><div class="s-value">${j.workersRequired}</div></div>
      <div class="stat-cell"><div class="s-label">${t("ttl_Workers Hired")}</div><div class="s-value">${j.workersHired}</div></div>
      <div class="stat-cell"><div class="s-label">${t("ttl_Positions Remaining")}</div><div class="s-value">${Math.max(j.workersRequired - j.workersHired, 0)}</div></div>
      <div class="stat-cell"><div class="s-label">${t("ttl_Wage")}</div><div class="s-value">${j.wage ? inr(j.wage) : "—"}</div></div>`;

    document.getElementById("detailTable").innerHTML = `
      <tr><td style="color:var(--c-text-dim);width:160px;">${t("ttl_Description")}</td><td>${j.description || "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Category")}</td><td>${j.category || "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Skill Required")}</td><td>${j.skillRequired || "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Worker Type")}</td><td>${j.workerType ? tBadge(j.workerType) : "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Wage (₹)")}</td><td>${j.wage ? inr(j.wage) + " / " + tBadge(j.wageType||"daily") : "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Start Date")}</td><td>${j.startDate ? new Date(j.startDate).toLocaleDateString("en-IN") : "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_End Date")}</td><td>${j.endDate ? new Date(j.endDate).toLocaleDateString("en-IN") : "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Working Hours")}</td><td>${j.workingHours || "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Experience Required (years)")}</td><td>${j.experienceRequired || 0}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Address")}</td><td>${j.address || "—"}</td></tr>
      <tr><td style="color:var(--c-text-dim);">${t("ttl_Additional Requirements")}</td><td>${j.additionalRequirements || "—"}</td></tr>`;

    const actions = document.getElementById("actionButtons");
    const sideTitle = document.getElementById("sideTitle");
    const sideBody = document.getElementById("sideBody");

    if(_user.role === "worker"){
      sideTitle.textContent = t("ttl_Apply Now");
      if(_myApp){
        sideBody.innerHTML = `
          <p style="color:var(--c-text-muted);font-size:12.5px;">${t("ttl_Status")}: <span class="badge ${badgeClass(_myApp.status)}">${tBadge(_myApp.status)}</span></p>
          ${["pending","shortlisted"].includes(_myApp.status) ? `<button class="btn btn-danger" id="withdrawBtn" style="width:100%;justify-content:center;">${t("ttl_Withdraw Application")}</button>` : ""}`;
        const wb = document.getElementById("withdrawBtn");
        if(wb) wb.addEventListener("click", async () => {
          if(!confirm("Withdraw this application?")) return;
          try{ await Contralabos.marketplace.applications.withdraw(_myApp.id); window.location.reload(); }
          catch(err){ alert(err.message || t("ttl_Unable to submit application.")); }
        });
      } else if(j.status === "published" && j.workersHired < j.workersRequired){
        sideBody.innerHTML = `
          <div class="field"><label data-i18n="ttl_Application Message">${t("ttl_Application Message")}</label><textarea id="appMsg" rows="4" style="width:100%;background:var(--c-bg-inset);border:1px solid var(--c-border);color:var(--c-text);padding:10px;border-radius:var(--r-sm);"></textarea></div>
          <button class="btn btn-primary" id="applyBtn" style="width:100%;justify-content:center;">${t("ttl_Submit Application")}</button>`;
        document.getElementById("applyBtn").addEventListener("click", async () => {
          const btn = document.getElementById("applyBtn");
          btn.disabled = true; btn.textContent = "…";
          try{
            await Contralabos.marketplace.applications.apply(jobId, document.getElementById("appMsg").value);
            window.location.reload();
          }catch(err){ alert(err.message || t("ttl_Unable to submit application.")); btn.disabled = false; btn.textContent = t("ttl_Submit Application"); }
        });
      } else {
        sideBody.innerHTML = `<div class="empty-state">${t("ttl_No jobs available right now.")}</div>`;
      }
    } else if(_user.role === "contractor" && j.contractorId === _user.id){
      sideTitle.textContent = t("ttl_Status");
      sideBody.innerHTML = `<p style="color:var(--c-text-muted);font-size:12.5px;">${t("ttl_View Applications")} · ${t("ttl_View Hired Workers")}</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <button class="btn" onclick="window.location.href='applications.html?jobId=${j.id}'">${t("ttl_View Applications")}</button>
          <button class="btn" onclick="window.location.href='hired-workers.html'">${t("ttl_View Hired Workers")}</button>
          <button class="btn" onclick="window.location.href='find-workers.html'">${t("nav_findworkers")}</button>
        </div>`;
      let btns = `<button class="btn" onclick="window.location.href='post-job.html?id=${j.id}'">${t("ttl_Edit")}</button>`;
      if(j.status === "published") btns += `<button class="btn" id="pauseBtn">${t("ttl_Pause")}</button>`;
      if(j.status === "paused") btns += `<button class="btn" id="resumeBtn">${t("ttl_Resume")}</button>`;
      if(!["cancelled","completed"].includes(j.status)) btns += `<button class="btn btn-danger" id="cancelBtn">${t("ttl_Cancel Job")}</button>`;
      actions.innerHTML = btns;
      const pb = document.getElementById("pauseBtn"); if(pb) pb.addEventListener("click", async () => { await Contralabos.marketplace.jobs.pause(j.id); window.location.reload(); });
      const rb = document.getElementById("resumeBtn"); if(rb) rb.addEventListener("click", async () => { await Contralabos.marketplace.jobs.resume(j.id); window.location.reload(); });
      const cb = document.getElementById("cancelBtn"); if(cb) cb.addEventListener("click", async () => {
        if(!confirm("Cancel this job posting?")) return;
        await Contralabos.marketplace.jobs.cancel(j.id); window.location.reload();
      });
    } else {
      sideTitle.textContent = t("ttl_Job Details");
      sideBody.innerHTML = `<div class="empty-state">—</div>`;
    }
  }

  document.addEventListener("shell:ready", async (e) => {
    _user = e.detail.user;
    _job = await Contralabos.marketplace.jobs.get(jobId);
    if(!_job){ document.querySelector(".page").innerHTML = "<p>Job not found.</p>"; return; }
    if(_user.role === "worker"){
      const mine = await Contralabos.marketplace.applications.mine();
      _myApp = mine.find(a => a.jobId === jobId) || null;
    }
    render();
  });
  document.addEventListener("languagechange:contralabos", render);
</script>
</body>
</html>
