<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Job Offers — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="offers">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html" id="bcHome">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_offers">Job Offers</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" id="pageTitle" data-i18n="title_offers_contractor">Job Offers</div><div class="page-sub" id="pageSub" data-i18n="sub_offers_contractor">Direct offers you've sent to workers</div></div>
</div>
<div class="panel">
<table class="data-table">
<thead id="theadRow"></thead>
<tbody id="offersBody"></tbody>
</table>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return n === null || n === undefined ? "—" : "₹" + Number(n).toLocaleString("en-IN"); }
  let _role, allOffers = [];

  function contractorRow(o){
    const j = o.job || {};
    return `<tr>
      <td><a href="worker-profile-view.html?id=${o.workerId}" style="color:var(--c-gold-light);">${o.worker ? o.worker.name : "Worker"}</a></td>
      <td><a href="job-detail.html?id=${o.jobId}">${j.title || "—"}</a></td>
      <td>${o.offeredWage ? inr(o.offeredWage) : "—"}</td>
      <td><span class="badge ${badgeClass(o.status)}">${tBadge(o.status)}</span></td>
      <td style="text-align:right;">${o.status === "pending" ? `<button class="btn btn-sm btn-danger" data-act="withdraw" data-id="${o.id}">${t("ttl_Withdraw Offer")}</button>` : ""}</td>
    </tr>`;
  }
  function workerRow(o){
    const j = o.job || {};
    return `<tr>
      <td>${j.contractorName || "Contractor"}</td>
      <td><a href="job-detail.html?id=${o.jobId}">${j.title || "—"}</a></td>
      <td>${o.offeredWage ? inr(o.offeredWage) : "—"}</td>
      <td>${o.message || "—"}</td>
      <td><span class="badge ${badgeClass(o.status)}">${tBadge(o.status)}</span></td>
      <td style="text-align:right;white-space:nowrap;">
        ${o.status === "pending" ? `
          <button class="btn btn-sm btn-primary" data-act="accept" data-id="${o.id}">${t("ttl_Accept Offer")}</button>
          <button class="btn btn-sm btn-danger" data-act="reject" data-id="${o.id}">${t("ttl_Reject Offer")}</button>` : ""}
      </td>
    </tr>`;
  }

  function render(){
    const isContractor = _role === "contractor";
    document.getElementById("theadRow").innerHTML = isContractor
      ? `<tr><th>Worker</th><th data-i18n="ttl_Job Title*">Job</th><th data-i18n="ttl_Offered Wage (₹)">Offer</th><th>Status</th><th></th></tr>`
      : `<tr><th>Contractor</th><th data-i18n="ttl_Job Title*">Job</th><th data-i18n="ttl_Offered Wage (₹)">Offer</th><th data-i18n="ttl_Offer Message">Message</th><th>Status</th><th></th></tr>`;
    document.getElementById("offersBody").innerHTML = allOffers.length
      ? allOffers.map(isContractor ? contractorRow : workerRow).join("")
      : `<tr><td colspan="6"><div class="empty-state">${t("ttl_You don't have any job offers.")}</div></td></tr>`;
  }

  document.getElementById("offersBody").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if(!btn) return;
    const { act, id } = btn.dataset;
    btn.disabled = true;
    try{
      if(act === "withdraw") await Contralabos.marketplace.offers.withdraw(id);
      if(act === "accept") await Contralabos.marketplace.offers.accept(id);
      if(act === "reject") await Contralabos.marketplace.offers.reject(id);
      await load();
    }catch(err){ alert(err.message || t("ttl_Unable to complete hiring.")); btn.disabled = false; }
  });

  async function load(){
    allOffers = _role === "contractor"
      ? await Contralabos.marketplace.offers.sentByMe()
      : await Contralabos.marketplace.offers.receivedByMe();
    render();
  }

  document.addEventListener("shell:ready", async (e) => {
    _role = e.detail.user.role;
    document.getElementById("bcHome").href = _role === "contractor" ? "dashboard.html" : "dashboard-worker.html";
    document.getElementById("pageTitle").textContent = t(_role === "contractor" ? "title_offers_contractor" : "title_offers_worker");
    document.getElementById("pageSub").textContent = t(_role === "contractor" ? "sub_offers_contractor" : "sub_offers_worker");
    await load();
  });
  document.addEventListener("languagechange:contralabos", render);
</script>
</body>
</html>
