<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Applications — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="applications">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_applications">Applications</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="title_applications">Applications</div><div class="page-sub" data-i18n="sub_applications">Workers who've applied to your job postings</div></div>
</div>
<div class="panel">
<div class="table-toolbar">
<select id="fJob"><option value="">All Jobs</option></select>
<select id="fStatus">
<option value="">All Statuses</option>
<option data-i18n="ttl_Pending Review" value="pending">Pending</option>
<option data-i18n="ttl_Shortlisted" value="shortlisted">Shortlisted</option>
<option data-i18n="ttl_Hired" value="hired">Hired</option>
<option data-i18n="ttl_Declined" value="rejected">Rejected</option>
</select>
</div>
<table class="data-table">
<thead><tr>
<th>Worker</th><th data-i18n="ttl_Job Title*">Job</th><th data-i18n="ttl_Application Message">Message</th>
<th>Status</th><th></th>
</tr></thead>
<tbody id="appsBody"></tbody>
</table>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  let allApps = [];

  function row(a){
    const canAct = ["pending","viewed","shortlisted"].includes(a.status);
    return `<tr>
      <td><a href="worker-profile-view.html?id=${a.workerId}" style="color:var(--c-gold-light);">${a.worker ? a.worker.name : "Worker"}</a></td>
      <td><a href="job-detail.html?id=${a.jobId}">${a.job ? a.job.title : ""}</a></td>
      <td style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.message || "—"}</td>
      <td><span class="badge ${badgeClass(a.status)}">${tBadge(a.status)}</span></td>
      <td style="text-align:right;white-space:nowrap;">
        ${canAct ? `
          ${a.status !== "shortlisted" ? `<button class="btn btn-sm" data-act="shortlist" data-id="${a.id}">${t("ttl_Shortlisted")}</button>` : ""}
          <button class="btn btn-sm btn-primary" data-act="accept" data-id="${a.id}">${t("ttl_Accept & Hire")}</button>
          <button class="btn btn-sm btn-danger" data-act="reject" data-id="${a.id}">${t("ttl_Reject")}</button>
        ` : ""}
      </td>
    </tr>`;
  }

  function render(){
    const jobId = document.getElementById("fJob").value;
    const status = document.getElementById("fStatus").value;
    let rows = allApps;
    if(jobId) rows = rows.filter(a => a.jobId === jobId);
    if(status) rows = rows.filter(a => a.status === status);
    document.getElementById("appsBody").innerHTML = rows.length
      ? rows.map(row).join("")
      : `<tr><td colspan="5"><div class="empty-state">${t("ttl_You haven't received any applications yet.")}</div></td></tr>`;
  }

  document.getElementById("appsBody").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if(!btn) return;
    const { act, id } = btn.dataset;
    btn.disabled = true;
    try{
      if(act === "shortlist") await Contralabos.marketplace.applications.shortlist(id);
      if(act === "accept"){
        if(!confirm("Hire this worker for this job?")) { btn.disabled = false; return; }
        await Contralabos.marketplace.applications.accept(id);
      }
      if(act === "reject") await Contralabos.marketplace.applications.reject(id);
      await load();
    }catch(err){ alert(err.message || t("ttl_Unable to complete hiring.")); btn.disabled = false; }
  });

  async function load(){
    allApps = await Contralabos.marketplace.applications.forContractor();
    const jobId = new URLSearchParams(window.location.search).get("jobId");
    if(jobId) document.getElementById("fJob").value = jobId;
    const jobSel = document.getElementById("fJob");
    const seen = new Set(Array.from(jobSel.options).map(o=>o.value));
    allApps.forEach(a => {
      if(a.job && !seen.has(a.jobId)){ seen.add(a.jobId); const o = document.createElement("option"); o.value = a.jobId; o.textContent = a.job.title; jobSel.appendChild(o); }
    });
    render();
  }

  document.addEventListener("shell:ready", load);
  document.getElementById("fJob").addEventListener("change", render);
  document.getElementById("fStatus").addEventListener("change", render);
  document.addEventListener("languagechange:contralabos", render);
</script>
</body>
</html>
