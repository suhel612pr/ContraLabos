<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<title>Reset Password — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .box{width:100%;max-width:380px;background:var(--c-bg-raised);border:1px solid var(--c-border);border-radius:8px;padding:32px;}
  .auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .auth-logo .name{font-family:var(--f-serif);font-size:18px;font-weight:600;}
  h1{font-family:var(--f-serif);font-size:21px;font-weight:600;margin:0 0 6px;}
  .sub{color:var(--c-text-muted);font-size:13px;margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--c-text-muted);}
  .field input{width:100%;background:var(--c-bg-inset);border:1px solid var(--c-border);color:var(--c-text);padding:10px 12px;border-radius:6px;font-size:13px;}
  .btn-submit{width:100%;padding:12px;border-radius:6px;background:var(--c-gold);border:none;color:#1a1305;font-weight:700;font-size:13px;cursor:pointer;}
  .back-link{text-align:center;margin-top:16px;font-size:12.5px;}
  .back-link a{color:var(--c-gold-light);}
  .confirm-msg{display:none;font-size:12.5px;color:var(--c-status-approved);background:var(--c-status-approved-bg);padding:10px;border-radius:6px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="box">
  <div class="auth-logo">
    <svg width="24" height="24" viewBox="0 0 40 40" fill="none"><path d="M6 34V16L14 10V34" stroke="#c9974a" stroke-width="1.6"/><path d="M14 34V6L22 2V34" stroke="#c9974a" stroke-width="1.6"/><path d="M22 34V12L34 8V34" stroke="#c9974a" stroke-width="1.6"/><path d="M3 34H37" stroke="#e3b876" stroke-width="1.8"/></svg>
    <span class="name">CONTRALABOS</span>
  </div>
  <h1>Reset your password</h1>
  <p class="sub">Enter your account email and we'll send reset instructions.</p>
  <div class="confirm-msg" id="confirmMsg">If an account exists for that email, reset instructions have been sent.</div>
  <form id="resetForm">
    <div class="field"><label>Email address</label><input type="email" id="email" required placeholder="you@company.com"></div>
    <button type="submit" class="btn-submit">Send Reset Link</button>
  </form>
  <div class="back-link"><a href="login.html">← Back to sign in</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script>
  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    try{
      await Contralabos.auth.forgotPassword(email);
    }catch(err){
      // Intentionally still show the same generic confirmation regardless of
      // outcome — this endpoint must not reveal whether an email is registered.
    }
    document.getElementById("confirmMsg").style.display = "block";
  });
</script>
<script src="js/validate.js"></script>
</body>
</html>
