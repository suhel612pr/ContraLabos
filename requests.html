<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="manifest.json" rel="manifest"/>
<title>Requests &amp; Status — Contralabos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="css/tokens.css" rel="stylesheet"/>
<link href="css/app.css" rel="stylesheet"/>
</head>
<body data-page="requests">
<div class="app-shell">
<div id="sidebar-mount"></div>
<div class="main-col">
<div id="topnav-mount"></div>
<div class="breadcrumb"><a href="dashboard.html">Home</a><span class="sep">/</span><span class="current" data-i18n="nav_requests">Requests &amp; Status</span></div>
<div class="page">
<div class="page-head">
<div><div class="page-title" data-i18n="title_requests">Requests &amp; Status Tracking</div><div class="page-sub" data-i18n="sub_requests">Payment, material, and expense requests moving through review</div></div>
<div class="page-actions"><button class="btn btn-primary" id="newReqBtn">+ New Request</button></div>
</div>
<div class="panel">
<div class="table-toolbar">
<select id="fType"><option data-i18n="ttl_All Types" value="">All Types</option><option data-i18n="ttl_Payment" value="payment">Payment</option><option data-i18n="ttl_Material" value="material">Material</option><option data-i18n="ttl_Expense" value="expense">Expense</option></select>
<select id="fStatus"><option data-i18n="ttl_All Statuses" value="">All Statuses</option><option data-i18n="ttl_Submitted" value="submitted">Submitted</option><option data-i18n="ttl_Under Review" value="review">Under Review</option><option data-i18n="ttl_Approved" value="approved">Approved</option><option data-i18n="ttl_Rejected" value="rejected">Rejected</option><option data-i18n="ttl_Completed" value="completed">Completed</option></select>
<input id="fSearch" placeholder="Search request ID…" type="text"/>
</div>
<div class="table-wrap">
<table class="data-table" id="reqTable">
<thead><tr><th data-i18n="ttl_Request ID">Request ID</th><th data-i18n="ttl_Type">Type</th><th data-i18n="ttl_Project">Project</th><th data-i18n="ttl_Raised By">Raised By</th><th data-i18n="ttl_Amount">Amount</th><th data-i18n="ttl_Status">Status</th><th data-i18n="ttl_Submitted">Submitted</th></tr></thead>
<tbody></tbody>
</table>
</div>
<div class="table-pagination"><span id="rowCount">— results</span><span>Page 1 of 1</span></div>
</div>
</div>
</div>
</div>
<!-- New Request modal-ish panel (simple inline form, no popup animation) -->
<div id="newReqOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90;align-items:center;justify-content:center;">
<div class="panel" style="width:420px;margin:0;">
<div class="panel-head"><h3 data-i18n="ttl_New Request">New Request</h3><button class="btn btn-sm" id="closeReqBtn">✕</button></div>
<div class="panel-body">
<form id="reqForm">
<div class="field"><label data-i18n="ttl_Type*">Type <span class="req">*</span></label>
<select id="rqType" required=""><option data-i18n="ttl_Payment" value="payment">Payment</option><option data-i18n="ttl_Material" value="material">Material</option><option data-i18n="ttl_Expense" value="expense">Expense</option></select>
</div>
<div class="field"><label data-i18n="ttl_Project*">Project <span class="req">*</span></label>
<select id="rqProject" required=""></select>
</div>
<div class="field"><label data-i18n="ttl_Amount (₹)*">Amount (₹) <span class="req">*</span></label>
<input id="rqAmount" min="1" required="" type="number"/>
</div>
<div class="field"><label data-i18n="ttl_Note">Note</label><input id="rqNote" placeholder="Optional context" type="text"/></div>
<button class="btn btn-primary" style="width:100%;justify-content:center;" type="submit">Submit Request</button>
</form>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/chatbot.js"></script>
<script>
  function inr(n){ return "₹" + Number(n).toLocaleString("en-IN"); }
  let allReqs = [], allProjects = [];

  async function renderTable(){
    const type = document.getElementById("fType").value;
    const status = document.getElementById("fStatus").value;
    const search = document.getElementById("fSearch").value.toLowerCase();
    let rows = allReqs;
    if(type) rows = rows.filter(r=>r.type===type);
    if(status) rows = rows.filter(r=>r.status===status);
    if(search) rows = rows.filter(r=>r.id.toLowerCase().includes(search));
    const projName = (id) => (allProjects.find(p=>p.id===id)||{}).name || id;

    document.querySelector("#reqTable tbody").innerHTML = rows.length ? rows.map(r => `
      <tr onclick="window.location.href='request-detail.html?id=${r.id}'">
        <td class="row-link">${r.id}</td><td>${tBadge(r.type)}</td><td>${projName(r.projectId)}</td>
        <td>${r.raisedBy}</td><td class="num">${inr(r.amount)}</td>
        <td><span class="badge ${r.status}">${tBadge(r.status)}</span></td>
        <td>${new Date(r.createdAt).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}</td>
      </tr>`).join("") : `<tr><td colspan="7" style="color:var(--c-text-dim);text-align:center;padding:32px;">No requests match these filters. Try adjusting your search or filters above.</td></tr>`;
    document.getElementById("rowCount").textContent = rows.length + " results";
  }

  document.addEventListener("shell:ready", async () => {
    allReqs = await Contralabos.requests.list();
    allProjects = await Contralabos.projects.list();
    document.getElementById("rqProject").innerHTML = allProjects.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
    renderTable();
  });

  ["fType","fStatus"].forEach(id => document.getElementById(id).addEventListener("change", renderTable));
  document.getElementById("fSearch").addEventListener("input", renderTable);
  document.addEventListener("languagechange:contralabos", renderTable);

  document.getElementById("newReqBtn").addEventListener("click", () => document.getElementById("newReqOverlay").style.display = "flex");
  document.getElementById("closeReqBtn").addEventListener("click", () => document.getElementById("newReqOverlay").style.display = "none");

  document.getElementById("reqForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      type: document.getElementById("rqType").value,
      projectId: document.getElementById("rqProject").value,
      amount: Number(document.getElementById("rqAmount").value),
      raisedBy: Shell.currentUser.name,
      note: document.getElementById("rqNote").value
    };
    try{
      const r = await Contralabos.requests.create(payload);
      document.getElementById("newReqOverlay").style.display = "none";
      window.location.href = "request-detail.html?id=" + r.id;
    }catch(err){ alert(err.message || "Unable to create request."); }
  });
</script>
<script src="js/validate.js"></script>
</body>
</html>
